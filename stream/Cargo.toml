[workspace]
resolver = "2"
members = ["crates/stream-kernel", "crates/stream-log", "crates/stream-books", "crates/stream-codec", "crates/stream-cli", "crates/stream-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
stream-kernel = { path = "crates/stream-kernel" }
stream-log = { path = "crates/stream-log" }
stream-books = { path = "crates/stream-books" }
stream-codec = { path = "crates/stream-codec" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
